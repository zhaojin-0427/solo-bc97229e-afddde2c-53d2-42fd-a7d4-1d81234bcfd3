name: scan-time-normalizer

services:
  api:
    build: .
    image: scan-time-normalizer:latest
    ports:
      - "8000:8000"
    environment:
      # SQLite database (uploads, confirmed chunks, committed batches).
      INGEST_DB_PATH: /data/ingest.db
    volumes:
      - ingest_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  ingest_data:
